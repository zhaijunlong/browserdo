<!doctype html>
<meta charset="utf-8">
<title>Where a click on a container lands</title>
<style>
  body { font: 14px system-ui, sans-serif; padding: 16px; }
  .card { position: relative; width: 420px; height: 110px; border: 2px solid #48c;
          margin: 12px 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .card button, .card a { font: 14px system-ui; padding: 6px 14px; }
  .wide { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #log { margin-top: 12px; font-family: monospace; white-space: pre; border: 1px solid #ccc; padding: 8px; min-height: 70px; }
</style>
<p>Click the card itself and see which element gets the event</p>

<!-- 1: a button sits right on the card's center and stops propagation (the case not verified before) -->
<div class="card" role="button" tabindex="0" aria-label="CARD-1-BUTTON-AT-CENTER">
  <button id="b1">BTN-CENTER</button>
</div>

<!-- 2: a plain text span at the center; not an obstacle, the click point should not move -->
<div class="card" role="button" tabindex="0" aria-label="CARD-2-PLAIN-SPAN">
  <span>PLAIN-SPAN-CENTER</span>
</div>

<!-- 3: a clickable link covers the whole card -->
<div class="card" role="button" tabindex="0" aria-label="CARD-3-LINK-COVERS-ALL">
  <a class="wide" href="#never" id="a3">LINK-COVERS-ALL</a>
</div>

<!-- 4: the container has no action of its own; a clickable button sits on its center (covers only the center, not all of it) -->
<div class="card" role="button" tabindex="0" aria-label="CARD-4-NO-ACTION-OF-ITS-OWN">
  <button id="b4">BTN-4-CENTER</button>
</div>

<!-- 5: a small centered link (compare card 3, where the link covers the whole card) -->
<div class="card" role="button" tabindex="0" aria-label="CARD-5-SMALL-LINK">
  <a href="#small" id="a5">LINK-SMALL-CENTER</a>
</div>

<div id="log">(no clicks yet)</div>
<script>
  let n = 0;
  document.addEventListener('click', (e) => { window.__click_xy = [Math.round(e.clientX), Math.round(e.clientY)]; log('at (' + window.__click_xy + ') target <' + e.target.tagName + '>'); }, true);
  const log = (s) => {
    const el = document.getElementById('log');
    el.textContent = (el.textContent === '(no clicks yet)' ? '' : el.textContent + '\n') + (++n) + '. ' + s;
  };
  document.querySelectorAll('.card').forEach((c, i) => {
    if (i === 3) return;  // card 4: the container has no action of its own
    c.addEventListener('click', () => log('CARD-' + (i + 1) + ' card itself clicked'));
  });
  document.getElementById('b1').addEventListener('click', (e) => { log('BTN-1 button clicked'); e.stopPropagation(); });
  document.getElementById('b4').addEventListener('click', (e) => { log('BTN-4 button clicked'); e.stopPropagation(); });
  document.getElementById('a3').addEventListener('click', (e) => { log('LINK-3 link clicked'); e.preventDefault(); e.stopPropagation(); });
</script>
