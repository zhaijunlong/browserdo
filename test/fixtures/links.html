<!doctype html>

<title>links</title>
<!-- Every kind of link the link-address and agent-tab changes have to handle. -->

<p><a id="plain" href="https://example.com/plain?q=a&amp;p=2">plain link</a></p>
<p><a id="relative" href="stale-emsn-repro.html">relative link</a></p>
