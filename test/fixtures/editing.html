<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>editing</title>
<!-- Live cases for editing at a place, pressing keys and selecting text. -->
</head>
<body>
<textarea id="note" aria-label="Note">hello world
second line</textarea>
<input id="line" aria-label="Line" value="abc">
<input id="secret" aria-label="Secret" type="password" value="pw123">
<div id="body" aria-label="Body" contenteditable>我很喜欢这个方案，<span contenteditable="false">@张三</span>看一下</div>
</body>
</html>
